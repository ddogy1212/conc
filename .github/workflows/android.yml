name: Build installable Android APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'downloads/**'
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: conc-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: CONC-2h-photo-only-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
